<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b0e">
<title>RAZCAR — Automotive Experience</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#080a0d;color:white;font-family:Arial,sans-serif}
button{font:inherit;cursor:pointer}

#intro{
position:fixed;inset:0;z-index:10;
background:#080a0d;
display:flex;align-items:center;justify-content:center;
overflow:hidden;
transition:opacity 1.4s ease,visibility 1.4s;
}

.intro-image{
position:absolute;inset:0;
background:
linear-gradient(90deg,rgba(4,6,9,.88),rgba(4,6,9,.25),rgba(4,6,9,.72)),
linear-gradient(0deg,#080a0d 0%,transparent 55%),
url("https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=2400&q=90") center/cover;
animation:carReveal 2.5s ease both;
}

@keyframes carReveal{
from{transform:scale(1.12);filter:brightness(.2)}
to{transform:scale(1);filter:brightness(.85)}
}

.intro-content{
position:relative;z-index:2;
width:100%;text-align:center;
padding:25px;
animation:appear 2s ease both;
}

@keyframes appear{
from{opacity:0;transform:translateY(35px)}
to{opacity:1;transform:translateY(0)}
}

.logo{
font-size:clamp(55px,12vw,120px);
font-weight:900;
letter-spacing:.19em;
text-shadow:0 5px 35px #000;
}

.logo span{color:#a8c8e8}

.subtitle{
margin-top:14px;
letter-spacing:.45em;
font-size:11px;
color:#c7cbd0;
}

.line{
width:75px;height:2px;
background:#b7d5f3;
margin:32px auto;
box-shadow:0 0 15px #8bb9e8;
}

.start{
background:transparent;
border:1px solid rgba(255,255,255,.65);
color:white;padding:17px 38px;
letter-spacing:.22em;
font-size:11px;
transition:.4s;
}

.start:hover{
background:white;color:#080a0d;
box-shadow:0 0 35px #b7d5f3;
}

.intro-bottom{
position:absolute;bottom:30px;left:0;width:100%;
text-align:center;color:#858b92;
font-size:9px;letter-spacing:.35em;
}

#home{
position:fixed;inset:0;
display:flex;align-items:center;
opacity:0;visibility:hidden;
transition:opacity 1.5s;
background:
linear-gradient(90deg,rgba(5,7,10,.9),rgba(5,7,10,.25)),
url("https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=2400&q=90") center/cover;
}

#home.active{opacity:1;visibility:visible}

nav{
position:absolute;top:0;left:0;width:100%;
padding:30px 5%;
display:flex;justify-content:space-between;
align-items:center;
border-bottom:1px solid #ffffff20;
}

.nav-logo{font-weight:900;letter-spacing:.2em;font-size:23px}
.nav-logo span{color:#a8c8e8}

.nav-links{display:flex;gap:30px;font-size:10px;letter-spacing:.2em;color:#ddd}

.hero{padding:0 8%;max-width:850px}
.hero small{letter-spacing:.4em;color:#b7d5f3}
.hero h1{
font-size:clamp(45px,8vw,95px);
line-height:.95;margin:25px 0;
font-weight:900;letter-spacing:-.04em;
}
.hero p{color:#c4c8cd;line-height:1.8;max-width:480px;font-size:14px}

.explore{
margin-top:35px;padding:17px 35px;
background:#dce7f2;color:#10151b;border:0;
font-size:11px;letter-spacing:.2em;font-weight:bold;
}

@media(max-width:600px){
nav{padding:22px 6%}
.nav-links{gap:12px;font-size:8px}
.hero{padding:0 7%}
.hero p{font-size:12px}
}
</style>
</head>

<body>

<section id="intro">
<div class="intro-image"></div>

<div class="intro-content">
<div class="logo">RAZ<span>CAR</span></div>
<div class="subtitle">AUTOMOTIVE EXPERIENCE</div>
<div class="line"></div>
<button class="start" onclick="startExperience()">START EXPERIENCE</button>
</div>

<div class="intro-bottom">A NEW AUTOMOTIVE WORLD</div>
</section>

<main id="home">
<nav>
<div class="nav-logo">RAZ<span>CAR</span></div>
<div class="nav-links">
<span>HOME</span>
<span>CATALOG</span>
<span>GARAGE</span>
</div>
</nav>

<div class="hero">
<small>WELCOME TO RAZCAR</small>
<h1>BUILD YOUR<br>OWN LEGEND.</h1>
<p>
Discover a new automotive world.
Choose your car, redefine its character
and create something truly yours.
</p>
<button class="explore" onclick="alert('CAR CATALOG — COMING SOON')">
EXPLORE THE WORLD
</button>
</div>
</main>

<script>
function startExperience(){
document.getElementById("intro").style.opacity="0";
document.getElementById("intro").style.visibility="hidden";
document.getElementById("home").classList.add("active");
}
</script>

</body>
</html>
